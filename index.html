<style>

  .badge{display:inline-block;background:#FF7A29;color:#fff;font-size:10px;padding:2px 8px;border-radius:9px;vertical-align:middle;}
  .foot{font-size:11px;color:#aab1bd;text-align:center;margin-top:18px;}
